# The Azure emulator family, one command.
#
#   docker compose -f docker-compose.family.yml up
#     entra-emulator    :8443  the STS — issues every token, publishes the JWKS
#     keyvault-emulator :8444  Key Vault data plane (secrets, keys, certs)
#     arm-emulator      :8445  ARM control plane + Microsoft.Authorization RBAC
#
#   docker compose -f docker-compose.family.yml --profile fabric up
#     …adds fabric-emulator :9443 (Fabric control plane + OneLake), the
#     consumer that depends on all three. Profiled because it is a much
#     heavier image and most callers of this file don't need it; fabric's own
#     repo carries the richer overlays (compute, rti, governance, terminal).
#
# WHY THREE CONTAINERS, NOT ONE
# Each emulator is a static Go binary on distroless, so all three share one
# base layer and cost a few tens of MB of RSS — bundling saves essentially
# nothing. What it WOULD cost is fidelity: keyvault and arm validating entra's
# tokens over HTTP against a separate origin IS the production trust
# relationship. Keep the boundary; compose across it.
#
# ISSUER ALIGNMENT IS THE ONE THING THAT MUST MATCH
# Tokens carry iss = <entra login origin>/<tenant>/v2.0, so entra must
# ADVERTISE the origin its peers validate against. On this network that origin
# is https://entra-emulator:8443 — hence PUBLIC_ORIGIN below, and why every
# *_ENTRA_ISSUER repeats it verbatim. Point them at a real tenant instead and
# nothing else changes.
#
# Versions are overridable so consumers can pin a known-good release:
#   ENTRA_EMULATOR_VERSION=0.2.2 docker compose -f docker-compose.family.yml up -d
#
# STATE IS IN-MEMORY HERE. Every image bakes <PREFIX>_DATA_DIR=/data for
# callers who mount a volume; this file mounts none, so each is reset to ""
# or SQLite fails to open its file and the container exits before serving.
# To persist, drop the override and add a volume, e.g.:
#   volumes: ["kv-data:/data"]   (plus a top-level `volumes: kv-data:`)

x-entra-tenant: &tenant "11111111-1111-1111-1111-111111111111"

services:
  entra-emulator:
    image: ghcr.io/calvinchengx/entra-emulator:${ENTRA_EMULATOR_VERSION:-latest}
    environment:
      ORIGIN_MODE: compat # single origin, path-prefixed surfaces
      PUBLIC_ORIGIN: "https://entra-emulator:8443"
    ports:
      - "8443:8443" # login / graph / scim / discovery (JWKS)
    healthcheck:
      test: ["CMD", "/usr/local/bin/entra-emulator", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

  keyvault-emulator:
    image: ghcr.io/calvinchengx/azure-keyvault-emulator:${KEYVAULT_EMULATOR_VERSION:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "8444:8444" # Key Vault data plane
    environment:
      # Validate bearers against entra's JWKS; aud https://vault.azure.net is a
      # well-known Azure resource in entra-emulator v0.2.1+, so client
      # credentials resolve the vault audience with no resource-app seed step.
      KV_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      KV_ENTRA_TLS_INSECURE: "true" # trust entra's self-signed cert on this network
      KV_DATA_DIR: "" # see STATE note above
    healthcheck:
      test: ["CMD", "/usr/local/bin/azure-keyvault-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  arm-emulator:
    image: ghcr.io/calvinchengx/arm-emulator:${ARM_EMULATOR_VERSION:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
    ports:
      - "8445:8445" # ARM control plane (resources, Microsoft.Authorization)
    environment:
      # Same trust wiring as the others. ARM additionally evaluates RBAC role
      # assignments whose principalIds are entra's users/groups/SPs, so the two
      # must agree on the tenant — ARM_TENANT_ID already defaults to it.
      ARM_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      ARM_ENTRA_JWKS_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys"
      ARM_ENTRA_TLS_INSECURE: "true"
      ARM_TENANT_ID: *tenant
      # Explicit even though arm-emulator currently defaults DataDir to empty:
      # its Dockerfile bakes KV_DATA_DIR (a copy-paste of keyvault's) rather
      # than ARM_DATA_DIR, so the bake is inert today. Setting it here keeps
      # this file correct if that is ever fixed to bake ARM_DATA_DIR=/data.
      ARM_DATA_DIR: ""
    healthcheck:
      test: ["CMD", "/usr/local/bin/arm-emulator", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

  # The consumer. Opt in with `--profile fabric`; without the flag this service
  # never starts or pulls.
  fabric-emulator:
    profiles: [fabric]
    image: ghcr.io/calvinchengx/fabric-emulator:${FABRIC_EMULATOR_VERSION:-latest}
    depends_on:
      entra-emulator:
        condition: service_healthy
      keyvault-emulator:
        condition: service_healthy
      arm-emulator:
        condition: service_healthy
    ports:
      - "9443:9443" # api.fabric + onelake.dfs + portal (host-routed)
    environment:
      FABRIC_ENTRA_ISSUER: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/v2.0"
      FABRIC_ENTRA_JWKS_URL: "https://entra-emulator:8443/11111111-1111-1111-1111-111111111111/discovery/v2.0/keys"
      FABRIC_ENTRA_TLS_INSECURE: "true"
      FABRIC_DATA_DIR: "" # see STATE note above
