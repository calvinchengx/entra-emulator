name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Gate: the Makefile is what users are told to run, on all three platforms.
  # A release that publishes binaries whose documented entry point is broken on
  # Windows or macOS is worse than a late release. Nothing gated this workflow
  # before — a tag published straight to GHCR and the Releases page.
  make-targets:
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    uses: ./.github/workflows/make-targets.yml

  binaries:
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    name: Cross-platform binaries (GoReleaser)
    needs: make-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser needs full history/tags
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Write access to calvinchengx/homebrew-tap so GoReleaser can commit
          # the cask. Optional: if the secret is unset the homebrew_casks step
          # self-skips (skip_upload) instead of failing the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Write access to a calvinchengx/winget-pkgs fork so GoReleaser can
          # open the manifest PR against microsoft/winget-pkgs. Optional: if the
          # secret is unset the winget step self-skips (skip_upload).
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}

      # GoReleaser writes the cask it published into dist/homebrew/. Checking
      # the artifact rather than the config is what survives GoReleaser changing
      # its template underneath us; it runs after the push, so it cannot stop a
      # bad cask being published, but it makes the release red instead of
      # letting the deprecation land silently.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - name: The published cask uses no deprecated stanza
        run: uv run --no-project --python 3.12 scripts/check_cask_stanzas.py --rendered dist/homebrew

  image:
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
    name: Docker image → GHCR
    needs: make-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
