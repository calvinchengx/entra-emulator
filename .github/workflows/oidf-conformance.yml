name: OIDF conformance

# Runs the OpenID Foundation conformance plans against the emulator
# (docs/23-oidf-conformance.md): the Config OP profile, which checks the
# discovery document against the specification, and the Basic OP profile, whose
# 35 modules drive real logins through a scripted browser.
#
# Deliberately NOT part of the CI gate, for the same reason as golden-drift.yml:
# it pulls a third party's container image and runs a JVM, a MongoDB and a
# freshly built emulator, so making every push depend on that trades a real
# problem for a worse one. It is scheduled, and it fails loudly when it fails.
#
# Unlike golden-drift.yml this needs nothing from the network at test time: the
# OP under test is a sibling compose service, so there is no tunnel, no public
# hostname, and no dependency on Microsoft being reachable.

on:
  schedule:
    - cron: '41 5 * * 2' # weekly, Tuesday 05:41 UTC
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'e2e/conformance/**'
      - '.github/workflows/oidf-conformance.yml'
      - 'internal/identity/discovery.go'
      - 'internal/identity/authorize.go'
      - 'internal/identity/signin.go'

concurrency:
  group: oidf-conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Independent plans: one failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - plan: config
            name: Config OP certification profile
          - plan: basic
            name: Basic OP certification profile
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Run the plan
        run: uv run --no-project --python 3.12 python e2e/conformance/run.py ${{ matrix.plan }}

      # The per-condition logs are the whole evidentiary value of the run: the
      # summary says PASSED, the logs say which conditions produced it.
      - name: Upload the conformance logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidf-conformance-${{ matrix.plan }}
          path: e2e/conformance/results/
          if-no-files-found: warn
