name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only checks out and builds — no writes to the repo,
# packages, or deployments. Set at the top level so it applies to all jobs.
permissions:
  contents: read

jobs:
  # THE DOCS LANE. Every job below is gated on `code == 'true'` EXCEPT
  # `witnesses`: that is the job which READS the docs -- the parity claims and
  # the witnesses they name -- so it must run on a prose change and a code
  # change alike. The lane removes the jobs that cannot see the change, never
  # the ones that check it.
  #
  # The gate is a job rather than a `paths:` filter on the workflow. A job
  # skipped by `if:` still produces a completed check-run (conclusion
  # `skipped`), which branch protection accepts; a workflow that never
  # triggers produces no check-run at all, so a required check would sit at
  # "Expected" forever and the pull request could never merge.
  #
  # See .github/changed-files.sh, which fails OPEN on every way of not knowing:
  # force-push, tag, API error, empty list, or a list at the 300-file page cap.
  changes:
    name: Does this change any code?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/changed-files.sh

  test:
    name: Build, vet & unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Naming the files matters: `test -z "$(gofmt -l .)"` fails with no
      # output at all, so the one check whose entire job is "which file" tells
      # you nothing and you reproduce it locally to find out.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
      # Every module must be tidy on main. This is not style: `.goreleaser.yaml`
      # runs `go mod tidy` as a release hook, so an untidy go.mod would be
      # REWRITTEN during a release and the shipped binary built from a module
      # state nobody committed — silently, because a successful tidy prints
      # nothing. Failing here means the release hook can never have anything to
      # do. Same class as the `go mod download` pre-warm removed in #102.
      #
      # -diff reports the change and exits non-zero WITHOUT writing, so the
      # check cannot itself become the mutation it exists to prevent.
      - name: go.mod is tidy in every module
        run: |
          set -euo pipefail
          fail=0
          for m in . ./e2e/go ./samples/externalized-authz/compat ./samples/msal-go; do
            echo "==> $m"
            ( cd "$m" && go mod tidy -diff ) || fail=1
          done
          exit $fail

  portal:
    name: Portal builds from source
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter entra-emulator-portal test
      - run: pnpm --filter entra-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter entra-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: `vite build` + jsdom unit tests pass even when the
      # bundle resolves Svelte to its server build and never mounts. Only a real
      # browser catches that, so assert the built dist actually renders.
      - run: pnpm --filter entra-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter entra-emulator-portal smoke

  sdk-e2e:
    name: Real-SDK e2e (msal-node, Graph SDK, MSAL Go/azidentity/.NET/Java, MSAL Python, node-saml)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # The TS e2e suite is standalone npm (e2e/ts); don't auto-detect the
          # root pnpm workspace for caching — pnpm isn't installed in this job.
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 e2e/run.py ts graph go python dotnet java saml wsfed

  docker-smoke:
    name: Docker image smoke test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/docker-smoke.sh

  samples:
    name: Samples compile
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      # Keep the copy-paste samples honest: fully build the typed Go sample
      # (catches API drift) and syntax-check the scripting samples.
      - run: go build -o /dev/null ./...
        working-directory: samples/msal-go
      - run: node --check samples/msal-node/index.mjs
      - run: python3 -m py_compile samples/msal-python/main.py
      # Compile the PDP-compat suite against the engine SDKs (no run, no Docker)
      # so API drift is caught on every push; the pdp-compat job runs it for real.
      - run: CGO_ENABLED=0 go test -tags=pdp_integration -run '^$' ./...
        working-directory: samples/externalized-authz/compat

  pdp-compat:
    name: PDP compat (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest # Docker preinstalled → testcontainers works
    timeout-minutes: 15
    strategy:
      fail-fast: false # one engine's failure must not hide the others
      matrix:
        include:
          - engine: casbin
            test: TestCasbin # in-process, no container
          - engine: openfga
            test: TestOpenFGA # ReBAC reference, via testcontainers
          - engine: spicedb
            test: TestSpiceDB # ReBAC (Zanzibar), via testcontainers
          - engine: keto
            test: TestKeto # ReBAC (Zanzibar), via testcontainers
          - engine: permify
            test: TestPermify # ReBAC (Zanzibar), via testcontainers
          - engine: opa
            test: TestOPA # Rego policy engine, in-process
          - engine: cedar
            test: TestCedar # Cedar policy engine (cedar-go), in-process
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration test
        working-directory: samples/externalized-authz/compat
        env:
          CGO_ENABLED: '0'
        run: go test -tags=pdp_integration -run '${{ matrix.test }}' -v ./...

  witnesses:
    name: Every supported parity claim names its witness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Strict: every claim is mapped, so a new 🟢 row without a witness — or a
      # witness that no longer exists — fails the build. That second case is the
      # valuable one: it catches a test being renamed or deleted out from under
      # the claim that depended on it.
      #
      # --no-project because this repo has no Python project; the checker is
      # stdlib-only. uv still supplies the interpreter, so the version is pinned
      # rather than whatever the runner happens to ship.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict

  browser-e2e:
    name: msal-browser witness (real browser, redirect flow)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The other SDK suites run server-side, so none of them is subject to the
      # same-origin policy. Only a real browser catches a missing CORS header on
      # the OIDC surface — without which no SPA can authenticate at all.
      - name: Install
        working-directory: e2e/browser
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the witness
        working-directory: e2e/browser
        run: npx playwright test

  passkey-e2e:
    name: Passkey / WebAuthn witness (Chromium + CDP virtual authenticator)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # WebAuthn pins the RP to the page origin, so this suite drives
      # navigator.credentials on the emulator itself — not the msal-browser SPA.
      - name: Install
        working-directory: e2e/passkey
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the witness
        working-directory: e2e/passkey
        run: npx playwright test

  az-cli-e2e:
    name: Azure CLI witness (az cloud register + service-principal login)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GitHub-hosted runners ship the Azure CLI. The suite is entra-only:
      # register a private cloud, login, get-access-token. No ARM companion.
      - run: az version
      - run: python3 e2e/az-cli/run.py

  fabric-e2e:
    name: Fabric companion witness (workspace-identity handshake)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # fabric-emulator is the consumer of Fabric-audience tokens and the
      # workspace-identity admin API. Its handshake tests start this checkout
      # in-process (go.mod replace) and drive the seam over HTTP — not another
      # entra unit test of the same endpoints.
      - run: python3 e2e/fabric/run.py

  implicit-e2e:
    name: Implicit / hybrid witness (Chromium front-channel redirect)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # msal-browser never emits response_type=id_token or code id_token.
      # This suite drives those authorize redirects in Chromium itself.
      - name: Install
        working-directory: e2e/implicit
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the witness
        working-directory: e2e/implicit
        run: npx playwright test

  scim-e2e:
    name: SCIM witness (scim2-tester, independent RFC checker)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v7
      # Microsoft ships no runnable SCIM client — the provisioning service is a
      # cloud service and the SCIM Validator is hosted, so neither can reach a
      # localhost emulator. scim2-tester is an independent RFC 7643/7644 checker,
      # which is a stronger witness than our own client driving our own server.
      - run: python3 e2e/run.py scim

  scim-outbound-e2e:
    name: SCIM outbound witness (Microsoft's own reference server)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # The emulator is the SCIM *client* here, so witnessing it needs a real
      # service provider on the other end. AzureAD/SCIMReferenceCode is the one
      # Microsoft publishes for exactly this shape, which makes it the only
      # Microsoft-authored witness in the SCIM cluster. It is cloned at a pinned
      # commit and built with the .NET 8 SDK; nothing about it is patched.
      - run: python3 e2e/run.py scim-outbound

  graph-permissions-e2e:
    name: Graph permission gate witness (real Graph SDK, denied and allowed)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The gate is config-only (GRAPH_PERMISSIONS) with no runtime toggle, and
      # the shared e2e emulator runs with it off, which is the default and
      # matches Entra for an unconfigured tenant. So this suite starts its own
      # emulator with the gate on rather than changing what every other suite
      # depends on.
      - run: python3 e2e/run.py graph-permissions

  jar-metadata-e2e:
    name: JAR by reference + cloud-instance metadata
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod, like every other job here: a hardcoded pin goes stale the
          # day go.mod's minimum moves.
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # jar: PyJWT signs the request object the emulator fetches, and the SSRF
      # guard is the property under test. cloud-metadata: the coordinates in
      # discovery are FOLLOWED, not just read.
      - run: python3 e2e/run.py jar cloud-metadata

  concurrency-e2e:
    name: Concurrency contracts (single-use codes, refresh reuse, races)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # go.mod, like every other job here.
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Real MSAL mints the credentials; the replays and the races are raw,
      # because no client library will knowingly present a spent credential.
      - run: python3 e2e/run.py concurrency

  persistence-e2e:
    name: Persistence witness (real Graph SDK across a restart)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The restart is the assertion, so this suite owns the emulator lifecycle:
      # it writes through the SDK, stops the process, starts a new one on the
      # same database, and reads the work back. Run against the shared emulator
      # there would be no restart, and every check would pass in memory.
      - run: python3 e2e/run.py persistence

  lint:
    name: golangci-lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A wedged run must fail rather than sit in GitHub's 6-hour default, where
    # 'pending' and 'stuck' look identical.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Gated at zero. .golangci.yml excludes unchecked Close, Rollback and
      # writes to a response, where the return value is unactionable at the
      # call site; everything surviving that is fixed rather than suppressed.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
