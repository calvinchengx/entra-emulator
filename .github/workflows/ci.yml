name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only checks out and builds — no writes to the repo,
# packages, or deployments. Set at the top level so it applies to all jobs.
permissions:
  contents: read

jobs:
  test:
    name: Build, vet & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  portal:
    name: Portal builds from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter entra-emulator-portal test
      - run: pnpm --filter entra-emulator-portal build
      # portal/dist is committed (go:embed bakes it into the binary so `go build`
      # / `go install @latest` need no Node). Fail if the committed copy has
      # drifted from a fresh build so it can never go stale.
      - name: Verify committed portal/dist is up to date
        run: |
          changes="$(git status --porcelain -- portal/dist)"
          if [ -n "$changes" ]; then
            echo "::error::portal/dist is stale. Run 'pnpm --filter entra-emulator-portal build' and commit portal/dist."
            echo "$changes"
            exit 1
          fi
      # Headless mount smoke: `vite build` + jsdom unit tests pass even when the
      # bundle resolves Svelte to its server build and never mounts. Only a real
      # browser catches that, so assert the built dist actually renders.
      - run: pnpm --filter entra-emulator-portal exec playwright install --with-deps chromium
      - run: pnpm --filter entra-emulator-portal smoke

  sdk-e2e:
    name: Real-SDK e2e (msal-node, Graph SDK, MSAL Go/azidentity/.NET/Java, MSAL Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          # The TS e2e suite is standalone npm (e2e/ts); don't auto-detect the
          # root pnpm workspace for caching — pnpm isn't installed in this job.
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 e2e/run.py ts graph go python dotnet java

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/docker-smoke.sh

  samples:
    name: Samples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      # Keep the copy-paste samples honest: fully build the typed Go sample
      # (catches API drift) and syntax-check the scripting samples.
      - run: go build -o /dev/null ./...
        working-directory: samples/msal-go
      - run: node --check samples/msal-node/index.mjs
      - run: python3 -m py_compile samples/msal-python/main.py
      # Compile the PDP-compat suite against the engine SDKs (no run, no Docker)
      # so API drift is caught on every push; the pdp-compat job runs it for real.
      - run: CGO_ENABLED=0 go test -tags=pdp_integration -run '^$' ./...
        working-directory: samples/externalized-authz/compat

  pdp-compat:
    name: PDP compat (${{ matrix.engine }})
    runs-on: ubuntu-latest # Docker preinstalled → testcontainers works
    strategy:
      fail-fast: false # one engine's failure must not hide the others
      matrix:
        include:
          - engine: casbin
            test: TestCasbin # in-process, no container
          - engine: openfga
            test: TestOpenFGA # ReBAC reference, via testcontainers
          - engine: spicedb
            test: TestSpiceDB # ReBAC (Zanzibar), via testcontainers
          - engine: keto
            test: TestKeto # ReBAC (Zanzibar), via testcontainers
          - engine: permify
            test: TestPermify # ReBAC (Zanzibar), via testcontainers
          - engine: opa
            test: TestOPA # Rego policy engine, in-process
          - engine: cedar
            test: TestCedar # Cedar policy engine (cedar-go), in-process
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Integration test
        working-directory: samples/externalized-authz/compat
        env:
          CGO_ENABLED: '0'
        run: go test -tags=pdp_integration -run '${{ matrix.test }}' -v ./...

  witnesses:
    name: Every supported parity claim names its witness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Strict: every claim is mapped, so a new 🟢 row without a witness — or a
      # witness that no longer exists — fails the build. That second case is the
      # valuable one: it catches a test being renamed or deleted out from under
      # the claim that depended on it.
      #
      # --no-project because this repo has no Python project; the checker is
      # stdlib-only. uv still supplies the interpreter, so the version is pinned
      # rather than whatever the runner happens to ship.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_witnesses.py --strict

  browser-e2e:
    name: msal-browser witness (real browser, redirect flow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The other SDK suites run server-side, so none of them is subject to the
      # same-origin policy. Only a real browser catches a missing CORS header on
      # the OIDC surface — without which no SPA can authenticate at all.
      - name: Install
        working-directory: e2e/browser
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run the witness
        working-directory: e2e/browser
        run: npx playwright test

  scim-e2e:
    name: SCIM witness (scim2-tester, independent RFC checker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: astral-sh/setup-uv@v7
      # Microsoft ships no runnable SCIM client — the provisioning service is a
      # cloud service and the SCIM Validator is hosted, so neither can reach a
      # localhost emulator. scim2-tester is an independent RFC 7643/7644 checker,
      # which is a stronger witness than our own client driving our own server.
      - run: python3 e2e/run.py scim

  scim-outbound-e2e:
    name: SCIM outbound witness (Microsoft's own reference server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # The emulator is the SCIM *client* here, so witnessing it needs a real
      # service provider on the other end. AzureAD/SCIMReferenceCode is the one
      # Microsoft publishes for exactly this shape, which makes it the only
      # Microsoft-authored witness in the SCIM cluster. It is cloned at a pinned
      # commit and built with the .NET 8 SDK; nothing about it is patched.
      - run: python3 e2e/run.py scim-outbound
