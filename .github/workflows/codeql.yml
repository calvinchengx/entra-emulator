# CodeQL — advanced (in-repo) setup, replacing the repo's Default setup.
#
# Scoped to FIRST-PARTY code only:
#   - go                    the emulator (root module)
#   - javascript-typescript the portal + docs website
#   - actions               these workflows
#
# Deliberately NOT scanned: java-kotlin, swift, csharp, python — those exist
# only as external-SDK e2e harnesses (e2e/java, e2e/dotnet, e2e/flutter) and the
# msal-python sample, i.e. code we neither author nor ship. Autobuild also can't
# build the Java sample, which is what broke Default setup.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '31 7 * * 1' # weekly, Monday 07:31 UTC (parity with Default setup)

# Superseding a PR run is free money. Superseding a main run is not: a cancelled
# CodeQL job still uploads its SARIF, flagged `unsuccessful execution` with zero
# results, and that errored analysis becomes the newest one for its category —
# which is exactly what the code-scanning tool status page reports. Landing a
# burst of commits cancelled 11 of our first 43 main runs this way. So main runs
# to completion; only PR pushes cancel.
# Least privilege by default. `analyze` overrides this with the wider set it
# genuinely needs (security-events: write). Without a default here, any job
# that forgets its own block silently inherits the repository default --
# which is exactly what happened to `changes` and raised code-scanning #24.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A docs-only change cannot alter what CodeQL finds. The gate is a job rather
  # than `paths-ignore:` on the workflow: a job skipped by `if:` still produces
  # a completed check-run (conclusion `skipped`), which branch protection
  # accepts, while a workflow that never ran produces no check-run at all and
  # leaves a required check "Expected" forever. See .github/changed-files.sh,
  # which fails OPEN on every way of not knowing.
  changes:
    name: Does this change any code?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # contents: read for the compare endpoint, pull-requests: read for
    # pulls/{n}/files. Public-repo data is readable without the latter, so the
    # gap would only appear if this repo ever went private.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # A plain shallow checkout: this needs one script, and a sparse pattern
      # that stopped matching would error the job for a reason nobody would
      # guess. Three seconds against a suite this gate saves twenty minutes of.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/changed-files.sh

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false # one language's failure must not hide the others
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin the Go toolchain so autobuild compiles the root module cleanly.
      # (Nested modules under e2e/ and samples/ are separate go.mod roots and are
      # excluded from the parent's `go build ./...`, so only the emulator builds.)
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
