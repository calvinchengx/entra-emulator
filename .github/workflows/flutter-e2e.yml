# On-device Flutter e2e (docs/11-e2e-sdk-matrix.md).
#
# Runner choice is deliberate:
#   - Android emulator runs on ubuntu-latest, which has KVM. GitHub's modern
#     macOS runners (macos-14+) are arm64 WITHOUT nested virtualization, so
#     the Android emulator cannot boot there.
#   - iOS simulator runs on macos-latest (simulators are not VMs).
#
# The automated test drives the device-code flow (no browser needed). The
# flutter_appauth auth-code flow opens an external system browser that
# integration tests can't drive — it ships as a manual screen in the app.
name: Flutter e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly

# Least privilege: both jobs only check out and run tests. No repo writes.
permissions:
  contents: read

jobs:
  android:
    name: Android emulator (ubuntu + KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and start the emulator (plain HTTP for device reachability)
        run: |
          go build -o /tmp/entra-emulator ./cmd/entra-emulator
          mkdir -p /tmp/emu && cd /tmp/emu
          TLS_ENABLED=false PORT=8443 ORIGIN_MODE=compat REQUEST_LOG=true \
            PUBLIC_ORIGIN=http://10.0.2.2:8443 \
            nohup /tmp/entra-emulator > server.log 2>&1 &
          for i in $(seq 1 50); do curl -s http://localhost:8443/health && break; sleep 0.2; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration test on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: e2e/flutter
          script: flutter test integration_test --dart-define=EMU_ORIGIN=http://10.0.2.2:8443

  ios:
    name: iOS simulator (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and start the emulator (plain HTTP on loopback)
        run: |
          go build -o /tmp/entra-emulator ./cmd/entra-emulator
          mkdir -p /tmp/emu && cd /tmp/emu
          TLS_ENABLED=false PORT=8443 ORIGIN_MODE=compat REQUEST_LOG=true \
            nohup /tmp/entra-emulator > server.log 2>&1 &
          for i in $(seq 1 50); do curl -s http://localhost:8443/health && break; sleep 0.2; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Boot an iOS simulator
        id: sim
        # No model pin — available device models change with the runner's
        # Xcode version; any booted iPhone simulator works for this test.
        uses: futureware-tech/simulator-action@v5
        with:
          os: iOS
      # TIMED OUT AT THE STEP, NOT AT THE JOB, AND IT SAYS WHAT IT SAW.
      #
      # This step hangs intermittently AFTER a successful Xcode build: on
      # 2026-09-01 the log reads `Xcode build done. 156.1s` at 08:54:10 and
      # then nothing at all until the job's 45-minute budget killed it at
      # 09:29. Same shape on 2026-08-28. It is not a slow job that needs a
      # bigger budget: the runs that pass take 6 to 11 minutes, and the two
      # that hung both ran 45.4, which is the ceiling rather than a duration.
      #
      # Cancelled is the worst possible outcome to report, because it is
      # neither pass nor fail: it reads as infrastructure, it costs 45 minutes
      # of a macOS runner, and it leaves no evidence of where it stopped. 15
      # minutes is comfortably above every passing run and turns the hang into
      # a FAILURE that arrives three times sooner.
      #
      # The simulator log is dumped on the way out, because the next
      # occurrence is otherwise as undiagnosable as this one: everything up to
      # `Xcode build done` succeeds, so whatever stalls is in app launch or
      # the test run, and nothing in the step's own output describes it.
      # A WATCHDOG, because the 15-minute cap kills the one process that knows.
      #
      # #143's capture answered where this is NOT. The predicate matches
      # `process == "launchd_sim"` unconditionally, so every spawn in the
      # window was recorded whatever the app did or did not log -- and the only
      # spawn in 20 minutes is the diagnostic `log` tool itself (pid 50390 at
      # 13:13:42). `installd` logged nothing at all. On 2026-09-01 the build
      # finished at 13:02:48 (`Xcode build done. 110.3s`) and the step then
      # produced NOTHING for 10m52s until the cap.
      #
      # So the app is never installed and never spawned: the stall is inside
      # flutter's own tooling, between a successful build and handing anything
      # to the simulator. More simulator-side logging cannot see it, because
      # nothing simulator-side is happening.
      #
      # WHY 10 MINUTES, and why it does not kill. The three most recent passing
      # runs took 4m58s, 7m30s and 7m48s for this step, so 10 is above every
      # healthy run with room to spare. Sampling does not stop the process --
      # a merely-slow run is unharmed and still passes -- and the 15-minute cap
      # remains the thing that ends a hang. This only makes sure the cap is not
      # the FIRST thing to say something.
      - name: Run integration test on the iOS simulator
        working-directory: e2e/flutter
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          BUNDLE_ID: com.example.entraEmulatorE2e
          # WHY THE HANG HAPPENED, and why these five variables end it.
          #
          # A simulator build is never signed. But this project carries
          # `CODE_SIGN_STYLE = Automatic` on three targets and a real
          # `DEVELOPMENT_TEAM` (Runner.xcodeproj), and automatic signing makes
          # Xcode evaluate provisioning anyway -- an evaluation that asks the
          # Apple Developer PORTAL which capabilities the app id has. This
          # runner has no Apple account to authenticate that with, so the query
          # does not fail, it waits.
          #
          # Measured, not guessed. Run 33514608182 stalled for the full 15m
          # after `Fetching from https://github.com/openid/AppAuth-iOS...`, and
          # the watchdog below caught xcodebuild parked in:
          #
          #   -[IDEProvisioningManager evaluateProvisioningForProvisionable:...]
          #     +[IDEProvisionableSnapshot appIDFeaturesFromProvisionable:...]
          #       -[Xcode3TargetCapabilitiesContext(DVTPortalAppIDFeatures) ...]
          #         IDECapabilityQuerySelection.loadInitialCapabilities(...)
          #           IDECapabilityCachedPortalItemLocator.items(query:)
          #
          # with dart blocked in `__wait4` on that child -- flutter was not
          # stuck, it was waiting for Xcode, which was waiting for the portal.
          # That also explains the negative the previous run recorded: nothing
          # was ever installed because the build never finished.
          #
          # OVERRIDE, DO NOT EDIT THE PROJECT. flutter forwards any
          # `FLUTTER_XCODE_<SETTING>` to xcodebuild as `<SETTING>=<value>`
          # (flutter_tools `ios/mac.dart`, via
          # `environmentVariablesAsXcodeBuildSettings`). Overriding here keeps
          # the change scoped to CI: a developer building for a real device
          # still gets the automatic signing and the team the project declares.
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ''
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: 'NO'
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: ''
        run: |
          set -o pipefail
          flutter test integration_test -d "$UDID" \
            --dart-define=EMU_ORIGIN=http://localhost:8443 &
          test_pid=$!

          (
            sleep 600
            kill -0 "$test_pid" 2>/dev/null || exit 0
            echo "::group::watchdog: still running after 10m"

            # WAS IT EVER INSTALLED? simctl answers from its own records rather
            # than from the log store, so this does not depend on any process
            # having logged. `get_app_container` failing is the difference
            # between "flutter never got that far" and "installed, never ran".
            echo "--- is the app installed on the simulator?"
            xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" 2>&1 \
              || echo "(not installed — flutter never handed it to the simulator)"

            # WHERE IS IT BLOCKED. `sample` names the call stack, which is the
            # one thing 11 minutes of silence cannot tell you. Dart and flutter
            # both, since the hang may be in either.
            echo "--- processes"
            ps -ax -o pid,etime,command | grep -E '[d]art|[f]lutter|[x]codebuild' || true
            for pid in $(pgrep -f 'dart|flutter' | head -4); do
              echo "--- sample $pid"
              /usr/bin/sample "$pid" 3 -mayDie 2>/dev/null | head -60 \
                || echo "(sample failed for $pid)"
            done
            echo "::endgroup::"
          ) &
          watchdog_pid=$!

          # `|| status=$?` because the step runs under `bash -e`: a bare
          # `wait` on a failing test would exit the script right there, and
          # the lines below -- including the watchdog cleanup and the explicit
          # exit -- would never run. The test's own status is still what this
          # step reports.
          status=0
          wait "$test_pid" || status=$?
          kill "$watchdog_pid" 2>/dev/null || true
          exit "$status"

      - name: What the simulator was doing when it hung
        if: failure()
        run: |
          # SCOPED TO THE APP, IN TWO PASSES OF NARROWING.
          #
          # Unfiltered, this returned 300 lines of `apsd` push-daemon chatter.
          # Filtered but including `SpringBoard`, it returned UserNotifications
          # bookkeeping for `com.apple.Health` instead: a capture that runs,
          # fills the log, and still says nothing about the test. SpringBoard
          # is the system shell, so it narrates every housekeeping task on the
          # device and drowns the app it was meant to frame.
          #
          # `launchd_sim` IS UNCONDITIONAL, DELIBERATELY. It is what reports a
          # launch that never completed, and "launchd_sim spawned exactly one
          # process" is only a usable negative if the predicate would have
          # shown more. Scoping it to the bundle id makes the absence of
          # evidence indistinguishable from the filter having removed it.
          #
          # IT WAS BRIEFLY SCOPED, ON A MEASUREMENT FROM THE WRONG MACHINE. An
          # idle simulator on a laptop emits ~12,900 launchd_sim lines in 20
          # minutes against SpringBoard's ~400, which made scoping it look
          # necessary. The runner is the other way round: in the capture from
          # run 33510528300 SpringBoard dominated the 200 captured lines and
          # launchd_sim contributed almost nothing. Measure the environment the
          # code runs in, not the one it was written on.
          #
          # SpringBoard stays out. That was the actual noise here: page after
          # page of UserNotifications bookkeeping for `com.apple.Health`, which
          # is the system shell narrating housekeeping and never the test.
          echo "::group::app log (com.example.entraEmulatorE2e)"
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show \
            --last 20m --style compact \
            --predicate 'subsystem CONTAINS "entraEmulatorE2e"
                      OR process CONTAINS "Runner"
                      OR process == "launchd_sim"
                      OR process == "installd"
                      OR eventMessage CONTAINS "entraEmulatorE2e"' \
            2>/dev/null | tail -200 || echo "(no app log available)"
          echo "::endgroup::"
          # LINE COUNTS, so the next reader can see whether the filter is still
          # right instead of guessing. This capture has been too wide twice,
          # and both times it produced output that looked like diagnosis.
          echo "::group::is the filter still the right width"
          for p in 'process CONTAINS "Runner"' \
                   'process == "launchd_sim"' \
                   'process == "installd"' \
                   'process == "SpringBoard"'; do
            n=$(xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show \
                  --last 20m --style compact --predicate "$p" 2>/dev/null | wc -l)
            echo "  $n  <- $p"
          done
          echo "::endgroup::"
          echo "::group::did the app crash"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -20 || true
          cat ~/Library/Logs/DiagnosticReports/Runner*.ips 2>/dev/null | head -60 \
            || echo "(no crash report)"
          echo "::endgroup::"
          # REQUEST_LOG=true above, so this now records one line per request.
          # An empty log below therefore means the app never reached the
          # emulator, which it did NOT mean before: the server used to log
          # only startup, so silence and "not recorded" were indistinguishable.
          echo "::group::emulator server log (one line per request)"
          echo "requests served: $(grep -cE ' -> [0-9]{3} ' /tmp/emu/server.log 2>/dev/null || echo 0)"
          tail -100 /tmp/emu/server.log 2>/dev/null || echo "(no server log)"
          echo "::endgroup::" 
