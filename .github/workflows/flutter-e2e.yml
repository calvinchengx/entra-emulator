# On-device Flutter e2e (docs/11-e2e-sdk-matrix.md).
#
# Runner choice is deliberate:
#   - Android emulator runs on ubuntu-latest, which has KVM. GitHub's modern
#     macOS runners (macos-14+) are arm64 WITHOUT nested virtualization, so
#     the Android emulator cannot boot there.
#   - iOS simulator runs on macos-latest (simulators are not VMs).
#
# The automated test drives the device-code flow (no browser needed). The
# flutter_appauth auth-code flow opens an external system browser that
# integration tests can't drive — it ships as a manual screen in the app.
name: Flutter e2e

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly

# Least privilege: both jobs only check out and run tests. No repo writes.
permissions:
  contents: read

jobs:
  android:
    name: Android emulator (ubuntu + KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and start the emulator (plain HTTP for device reachability)
        run: |
          go build -o /tmp/entra-emulator ./cmd/entra-emulator
          mkdir -p /tmp/emu && cd /tmp/emu
          TLS_ENABLED=false PORT=8443 ORIGIN_MODE=compat REQUEST_LOG=true \
            PUBLIC_ORIGIN=http://10.0.2.2:8443 \
            nohup /tmp/entra-emulator > server.log 2>&1 &
          for i in $(seq 1 50); do curl -s http://localhost:8443/health && break; sleep 0.2; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run integration test on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: e2e/flutter
          script: flutter test integration_test --dart-define=EMU_ORIGIN=http://10.0.2.2:8443

  ios:
    name: iOS simulator (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and start the emulator (plain HTTP on loopback)
        run: |
          go build -o /tmp/entra-emulator ./cmd/entra-emulator
          mkdir -p /tmp/emu && cd /tmp/emu
          TLS_ENABLED=false PORT=8443 ORIGIN_MODE=compat REQUEST_LOG=true \
            nohup /tmp/entra-emulator > server.log 2>&1 &
          for i in $(seq 1 50); do curl -s http://localhost:8443/health && break; sleep 0.2; done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Boot an iOS simulator
        id: sim
        # No model pin — available device models change with the runner's
        # Xcode version; any booted iPhone simulator works for this test.
        uses: futureware-tech/simulator-action@v5
        with:
          os: iOS
      # TIMED OUT AT THE STEP, NOT AT THE JOB, AND IT SAYS WHAT IT SAW.
      #
      # This step hangs intermittently AFTER a successful Xcode build: on
      # 2026-09-01 the log reads `Xcode build done. 156.1s` at 08:54:10 and
      # then nothing at all until the job's 45-minute budget killed it at
      # 09:29. Same shape on 2026-08-28. It is not a slow job that needs a
      # bigger budget: the runs that pass take 6 to 11 minutes, and the two
      # that hung both ran 45.4, which is the ceiling rather than a duration.
      #
      # Cancelled is the worst possible outcome to report, because it is
      # neither pass nor fail: it reads as infrastructure, it costs 45 minutes
      # of a macOS runner, and it leaves no evidence of where it stopped. 15
      # minutes is comfortably above every passing run and turns the hang into
      # a FAILURE that arrives three times sooner.
      #
      # The simulator log is dumped on the way out, because the next
      # occurrence is otherwise as undiagnosable as this one: everything up to
      # `Xcode build done` succeeds, so whatever stalls is in app launch or
      # the test run, and nothing in the step's own output describes it.
      - name: Run integration test on the iOS simulator
        working-directory: e2e/flutter
        timeout-minutes: 15
        run: flutter test integration_test -d ${{ steps.sim.outputs.udid }} --dart-define=EMU_ORIGIN=http://localhost:8443

      - name: What the simulator was doing when it hung
        if: failure()
        run: |
          # SCOPED TO THE APP, IN TWO PASSES OF NARROWING.
          #
          # Unfiltered, this returned 300 lines of `apsd` push-daemon chatter.
          # Filtered but including `SpringBoard`, it returned UserNotifications
          # bookkeeping for `com.apple.Health` instead: a capture that runs,
          # fills the log, and still says nothing about the test. SpringBoard
          # is the system shell, so it narrates every housekeeping task on the
          # device and drowns the app it was meant to frame.
          #
          # `launchd_sim` IS KEPT BUT SCOPED, and this is the part that would
          # have gone wrong. It is what reports a launch that never completed,
          # so it belongs here, but unfiltered it is far louder than the
          # SpringBoard noise it replaces: MEASURED ON AN IDLE SIMULATOR,
          # 12,942 lines against SpringBoard's 415, and 2 once scoped to this
          # app. Keeping it whole would have swapped one flood for a bigger
          # one, under a `tail -200` that would have hidden the app entirely.
          #
          # What is left: the app itself (`Runner` is what Flutter names the
          # iOS target), anything naming the bundle id, and launchd_sim only
          # where it is talking about this app.
          echo "::group::app log (com.example.entraEmulatorE2e)"
          xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show \
            --last 20m --style compact \
            --predicate 'subsystem CONTAINS "entraEmulatorE2e"
                      OR process CONTAINS "Runner"
                      OR eventMessage CONTAINS "entraEmulatorE2e"
                      OR (process == "launchd_sim"
                          AND eventMessage CONTAINS "entraEmulatorE2e")' \
            2>/dev/null | tail -200 || echo "(no app log available)"
          echo "::endgroup::"
          # LINE COUNTS, so the next reader can see whether the filter is still
          # right instead of guessing. This capture has been too wide twice,
          # and both times it produced output that looked like diagnosis.
          echo "::group::is the filter still the right width"
          for p in 'process CONTAINS "Runner"' \
                   'process == "launchd_sim"' \
                   '(process == "launchd_sim" AND eventMessage CONTAINS "entraEmulatorE2e")'; do
            n=$(xcrun simctl spawn ${{ steps.sim.outputs.udid }} log show \
                  --last 20m --style compact --predicate "$p" 2>/dev/null | wc -l)
            echo "  $n  <- $p"
          done
          echo "::endgroup::"
          echo "::group::did the app crash"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -20 || true
          cat ~/Library/Logs/DiagnosticReports/Runner*.ips 2>/dev/null | head -60 \
            || echo "(no crash report)"
          echo "::endgroup::"
          # REQUEST_LOG=true above, so this now records one line per request.
          # An empty log below therefore means the app never reached the
          # emulator, which it did NOT mean before: the server used to log
          # only startup, so silence and "not recorded" were indistinguishable.
          echo "::group::emulator server log (one line per request)"
          echo "requests served: $(grep -cE ' -> [0-9]{3} ' /tmp/emu/server.log 2>/dev/null || echo 0)"
          tail -100 /tmp/emu/server.log 2>/dev/null || echo "(no server log)"
          echo "::endgroup::" 
