name: Attribution

# No Co-authored-by or Claude-Session trailers, from any contributor, in any
# commit or in the pull request description (scripts/check_attribution.py).
# The repository squash-merges with the description as the commit message, so
# the description is what lands on main.
#
# Its own workflow rather than a job in ci.yml because it must rerun when the
# description is EDITED, and adding `edited` to ci.yml would rerun the whole
# suite on every description change. It never skips: the rule applies to a
# docs-only change as much as to code.
#
# The push run exists because a merge can add trailers the pull request never
# had: GitHub's generated squash message appends `Co-authored-by:` for the
# pull request's commit authors (it did for every Dependabot merge). That run
# cannot block anything; it makes the commit that landed one fail loudly.
# Merge with an explicit message (`gh pr merge --squash --body ...`) to avoid it.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trailers:
    name: No co-authorship trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      # The checker's own controls first: a gate that never fires is
      # indistinguishable from a clean pull request.
      - run: uv run --no-project --python 3.12 python -m unittest scripts/test_check_attribution.py
      # The description goes through env and a file, never into the script
      # text: it is attacker-controlled input on a fork pull request.
      - name: Check commits and description
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          uv run --no-project --python 3.12 python scripts/check_attribution.py \
            --range "$BASE_SHA..$HEAD_SHA" --body-file "$RUNNER_TEMP/pr-body.md"
      - name: Check the commits this push landed
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          uv run --no-project --python 3.12 python scripts/check_attribution.py --range "$BEFORE..$AFTER"
