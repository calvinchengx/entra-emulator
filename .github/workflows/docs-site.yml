name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/coverage_badges.py'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_landing_page.py'
      - 'Makefile'
      - 'website/published-routes.txt'
      - 'scripts/check_witnesses.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check — the docs generator shells out to
  # git for the parity versions, so a PR that breaks it should fail here rather
  # than after merge. Build only: the deploy job is skipped below.
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/coverage_badges.py'
      - 'scripts/assemble_site.py'
      - 'scripts/check_docs_links.py'
      - 'scripts/check_landing_page.py'
      - 'Makefile'
      - 'website/published-routes.txt'
      - 'scripts/check_witnesses.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
#
# PR builds get their OWN group, per ref. They must not share the deploy group:
# GitHub keeps at most one PENDING run per concurrency group and cancels the
# older one when a newer arrives, so while runners are saturated a steady
# arrival of PR builds cancels the queued main-branch run over and over and the
# site never publishes. A Dependabot batch is exactly that arrival pattern, and
# it did this to the sibling repos' sites; nothing in the UI explains it,
# because a cancelled run reads as a harmless supersession.
#
# PR builds also cancel their own predecessors (only the newest matters);
# deploys never cancel a running publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      # ONE STEP, AND IT IS THE ONE A DEVELOPER RUNS. `make docs-serve` builds
      # with this same target and then serves the result at the paths it
      # publishes under, so what is previewed locally is what deploys from
      # here. Spelling the sequence out in YAML instead is how the two drift:
      # the local recipe is the one nobody updates, and it is also the only one
      # anyone looks at before pushing.
      #
      # What it runs, and why each part is not redundant, is documented at the
      # target in the Makefile. In short: the doc links (the Astro build exits
      # 0 on a dangling one and publishes a 404), the Starlight build, the
      # assembler with its pre-move route oracle and its self-test, and the
      # landing page, which Astro never sees.
      - run: make docs-build
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PRs get the build as a check only. Deploying from a PR ref would be
    # rejected by the github-pages environment regardless.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
