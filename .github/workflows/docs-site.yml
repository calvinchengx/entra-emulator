name: Docs site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/coverage_badges.py'
      - 'scripts/check_witnesses.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  # Pull requests build the site as a check — the docs generator shells out to
  # git for the parity versions, so a PR that breaks it should fail here rather
  # than after merge. Build only: the deploy job is skipped below.
  pull_request:
    paths:
      - 'docs/**'
      - 'site/**'
      - 'scripts/coverage_badges.py'
      - 'scripts/check_witnesses.py'
      - 'website/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deploy at a time; don't cancel a running publish.
#
# PR builds get their OWN group, per ref. They must not share the deploy group:
# GitHub keeps at most one PENDING run per concurrency group and cancels the
# older one when a newer arrives, so while runners are saturated a steady
# arrival of PR builds cancels the queued main-branch run over and over and the
# site never publishes. A Dependabot batch is exactly that arrival pattern, and
# it did this to the sibling repos' sites; nothing in the UI explains it,
# because a cancelled run reads as a harmless supersession.
#
# PR builds also cancel their own predecessors (only the newest matters);
# deploys never cancel a running publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history + tags: the parity-version generator reads the map at each
      # `v*` tag (git show) and stamps the live map from `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Moved here from ci.yml when prose-only commits stopped running it. Its
      # inputs are docs/ and the sidebar, which trigger THIS workflow and no
      # longer trigger CI.
      #
      # The site build does NOT catch a dangling intra-doc link: measured, it
      # exits 0 and publishes a 404. Nor can it see a page missing from the
      # sidebar, which is published but unreachable by navigation.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
      - run: uv run --no-project --python 3.12 python scripts/check_docs_links.py --strict
      - run: pnpm --filter entra-emulator-docs build
      # The witness endpoint rides along with the docs site, served from
      # this project's own origin rather than a third party. Written AFTER
      # the Starlight build, which would otherwise wipe website/dist.
      - name: Write the badge and manifest endpoints
        run: python3 scripts/coverage_badges.py --out website/dist
      # The hand-written landing page becomes the site root, and the docs keep
      # every URL they already had: Starlight's base stays `/entra-emulator/`,
      # so nothing published moves. Its own front door is /overview/, which is
      # why sync-docs.mjs writes overview.md and not index.md -- there is no
      # Starlight index.html here to overwrite.
      #
      # AFTER the Starlight build, which would otherwise wipe website/dist,
      # and after the badge step for the same reason.
      - name: Put the landing page at the site root
        run: |
          set -euo pipefail
          test -s site/index.html
          cp site/index.html website/dist/index.html
          # The hero image is referenced relatively from the landing page, and
          # /docs is not otherwise copied into the site.
          cp docs/demo/demo.gif website/dist/demo.gif
      # The landing page is not built by Astro, so nothing else checks its
      # links. Every relative href it carries must resolve inside the
      # assembled tree, and the manifest it fetches must be there too.
      - name: The landing page's links resolve
        run: python3 scripts/check_landing_page.py --site website/dist
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # PRs get the build as a check only. Deploying from a PR ref would be
    # rejected by the github-pages environment regardless.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
